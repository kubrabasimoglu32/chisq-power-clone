[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chisq-power"
version = "0.1.0"
description = "Power analysis engine and CLI for chi-square contingency table tests"
requires-python = ">=3.10"
dependencies = ["scipy>=1.7", "mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gpower-clone = "chisq_power.cli:main"
gpower-clone-mcp = "chisq_power.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
